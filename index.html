<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سیاره‌خور</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#000; color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, sans-serif;
    touch-action:none; user-select:none; }
  #app { position:relative; width:100vw; height:100vh; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:20px; text-align:center; background:#000; }
  .screen.hidden { display:none; }
  h1.title { font-size:30px; font-weight:800; margin-bottom:6px;
    background:linear-gradient(90deg,#4fa8ff,#ff5cf0); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle { color:#8a99ad; font-size:14px; margin-bottom:22px; }
  .card { background:linear-gradient(160deg,#141a24,#0d1218); border:1px solid #22303f;
    border-radius:18px; padding:20px; width:100%; max-width:380px; }
  input.name-input { width:100%; padding:14px 16px; border-radius:12px; border:1px solid #2c3d52;
    background:#0a0f16; color:#fff; font-size:17px; text-align:center; outline:none; margin-bottom:16px; }
  input.name-input:focus { border-color:#4fa8ff; }
  .section-label { font-size:13px; color:#8a99ad; margin:10px 0 8px; }
  .ai-count-row { display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .ai-btn { width:44px; height:44px; border-radius:12px; background:#141c28; border:1px solid #2c3d52;
    color:#cfe0f2; font-weight:700; font-size:16px; }
  .ai-btn.selected { background:linear-gradient(135deg,#4fa8ff,#3d7fc9); border-color:#4fa8ff; color:#fff; }
  button.btn { background:linear-gradient(135deg,#4fa8ff,#3d7fc9); color:#fff; border:none; border-radius:14px;
    padding:14px 20px; font-size:16px; font-weight:700; width:100%; box-shadow:0 6px 16px rgba(79,168,255,.3); }
  button.btn:active { transform:scale(.97); }
  button.btn.secondary { background:#161f2b; box-shadow:none; border:1px solid #2c3d52; color:#cfe0f2; margin-top:10px; }

  #hud { position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between;
    font-size:14px; color:#cfe0f2; pointer-events:none; z-index:5; }
  #hud b { color:#4fa8ff; }
  #joystick-base { position:absolute; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.15); display:none; z-index:6; }
  #joystick-knob { position:absolute; width:52px; height:52px; border-radius:50%;
    background:rgba(79,168,255,0.55); border:2px solid rgba(255,255,255,0.4); display:none; z-index:7; }

  .go-mass { font-size:44px; font-weight:900; color:#7ee787; margin:8px 0; }
  .go-best { color:#8a99ad; font-size:14px; margin-bottom:20px; }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <div class="screen" id="screen-setup">
    <h1 class="title">🪐 سیاره‌خور</h1>
    <p class="subtitle">دون‌ها رو بخور، بزرگ شو، مراقب سیاره‌های بزرگ‌تر باش</p>
    <div class="card">
      <input class="name-input" id="name-input" maxlength="12" placeholder="اسم شما...">
      <div class="section-label">چند تا هوش مصنوعی حریف باشه؟</div>
      <div class="ai-count-row" id="ai-count-row"></div>
      <button class="btn" id="start-btn">شروع بازی</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen hidden" id="screen-game" style="padding:0;">
    <canvas id="board"></canvas>
    <div id="hud">
      <span>حجم شما: <b id="hud-mass">0</b></span>
      <span>رکورد: <b id="hud-best">0</b></span>
    </div>
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div class="screen hidden" id="screen-over">
    <h1 class="title">بلعیده شدی! 💥</h1>
    <div class="go-mass" id="go-mass">0</div>
    <div class="go-best">رکورد شما: <b id="go-best">0</b></div>
    <div class="card" style="max-width:320px;">
      <button class="btn" id="retry-btn">🔁 دوباره بازی کن</button>
      <button class="btn secondary" id="menu-btn">منوی اصلی</button>
    </div>
  </div>

</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  const LS = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  /* ---------- screens ---------- */
  const screens = {};
  document.querySelectorAll('.screen').forEach(s => screens[s.id]=s);
  function showScreen(id){ Object.values(screens).forEach(s=>s.classList.add('hidden')); screens[id].classList.remove('hidden'); }

  /* ---------- setup screen ---------- */
  const nameInput = document.getElementById('name-input');
  nameInput.value = LS.get('pe_name','');
  let aiCount = LS.get('pe_aicount', 3);
  const aiRow = document.getElementById('ai-count-row');
  [1,2,3,4,5].forEach(n=>{
    const b=document.createElement('button');
    b.className='ai-btn'+(n===aiCount?' selected':'');
    b.textContent=n;
    b.addEventListener('click',()=>{ aiCount=n; LS.set('pe_aicount',n); aiRow.querySelectorAll('.ai-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); });
    aiRow.appendChild(b);
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    const name = (nameInput.value||'').trim().slice(0,12) || 'بازیکن';
    LS.set('pe_name', name);
    startGame(name, aiCount);
  });

  document.getElementById('retry-btn').addEventListener('click', () => startGame(LS.get('pe_name','بازیکن'), aiCount));
  document.getElementById('menu-btn').addEventListener('click', () => showScreen('screen-setup'));

  /* ---------- canvas setup ---------- */
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  function fitCanvas(){ canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio;
    canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  /* ---------- game constants ---------- */
  const WORLD = 3000;
  const PELLET_COUNT = 200;
  const BOT_COLORS = ['#ff5c5c','#ffd23d','#7ee787','#ff9d3d','#a86fff','#3dd6ff','#ff5cf0'];

  let player, bots, pellets, camScale, running, lastT;

  function radiusFromMass(m){ return 8 + Math.sqrt(m)*3.1; }
  function speedFromRadius(r){ return Math.max(46, 320/(1+r/34)); }

  function randPos(){ return { x: 40+Math.random()*(WORLD-80), y: 40+Math.random()*(WORLD-80) }; }

  function makePellet(){ const p=randPos(); return {x:p.x,y:p.y,r:5+Math.random()*3,color:`hsl(${Math.floor(Math.random()*360)},80%,60%)`}; }

  function makeBot(idx, awayFrom){
    let pos;
    do { pos = randPos(); } while (awayFrom && Math.hypot(pos.x-awayFrom.x,pos.y-awayFrom.y) < 500);
    return { name:'هوش مصنوعی '+idx, x:pos.x, y:pos.y, mass:14+Math.random()*14,
             color: BOT_COLORS[idx % BOT_COLORS.length], wanderDir:{x:0,y:0}, wanderT:0, dispR: 12 };
  }

  function startGame(name, count){
    player = { name, x:WORLD/2, y:WORLD/2, mass:22, color:'#4fa8ff', dispR: radiusFromMass(22) };
    bots = []; for (let i=1;i<=count;i++) bots.push(makeBot(i, player));
    pellets = []; for (let i=0;i<PELLET_COUNT;i++) pellets.push(makePellet());
    camScale = 1; running = true; lastT = null;
    document.getElementById('hud-best').textContent = getBest(name);
    showScreen('screen-game');
    fitCanvas();
    requestAnimationFrame(loop);
  }

  function getBest(name){
    const board = LS.get('pe_best', {});
    return Math.round(board[name] || 0);
  }
  function saveBest(name, mass){
    const board = LS.get('pe_best', {});
    if (!board[name] || mass > board[name]) { board[name] = mass; LS.set('pe_best', board); }
  }

  /* ---------- controls: dynamic joystick ---------- */
  let joy = { active:false, originX:0, originY:0, dx:0, dy:0 };
  const joyBase = document.getElementById('joystick-base');
  const joyKnob = document.getElementById('joystick-knob');
  const MAXJOY = 55;

  function joyStart(x,y){ joy.active=true; joy.originX=x; joy.originY=y; joy.dx=0; joy.dy=0;
    joyBase.style.display='block'; joyKnob.style.display='block';
    joyBase.style.left=(x-60)+'px'; joyBase.style.top=(y-60)+'px';
    joyKnob.style.left=(x-26)+'px'; joyKnob.style.top=(y-26)+'px'; }
  function joyMove(x,y){ if(!joy.active) return;
    let dx=x-joy.originX, dy=y-joy.originY; const d=Math.hypot(dx,dy);
    if (d>MAXJOY){ dx=dx/d*MAXJOY; dy=dy/d*MAXJOY; }
    joy.dx=dx/MAXJOY; joy.dy=dy/MAXJOY;
    joyKnob.style.left=(joy.originX+dx-26)+'px'; joyKnob.style.top=(joy.originY+dy-26)+'px'; }
  function joyEnd(){ joy.active=false; joy.dx=0; joy.dy=0; joyBase.style.display='none'; joyKnob.style.display='none'; }

  canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; joyStart(t.clientX,t.clientY); }, {passive:true});
  canvas.addEventListener('touchmove', e=>{ const t=e.touches[0]; joyMove(t.clientX,t.clientY); }, {passive:true});
  canvas.addEventListener('touchend', joyEnd);
  canvas.addEventListener('mousedown', e=>joyStart(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>{ if(joy.active) joyMove(e.clientX,e.clientY); });
  window.addEventListener('mouseup', joyEnd);

  const keys = {};
  window.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
  window.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);
  function keyboardDir(){
    let x=0,y=0;
    if (keys['arrowup']||keys['w']) y-=1;
    if (keys['arrowdown']||keys['s']) y+=1;
    if (keys['arrowleft']||keys['a']) x-=1;
    if (keys['arrowright']||keys['d']) x+=1;
    const d=Math.hypot(x,y); return d>0? {x:x/d,y:y/d} : {x:0,y:0};
  }

  /* ---------- game loop ---------- */
  function clampWorld(e){ e.x=Math.max(e.r||8, Math.min(WORLD-(e.r||8), e.x)); e.y=Math.max(e.r||8, Math.min(WORLD-(e.r||8), e.y)); }

  function updatePlayer(dt){
    player.dispR += (radiusFromMass(player.mass)-player.dispR)*Math.min(1,dt*6);
    let dir = joy.active ? {x:joy.dx,y:joy.dy} : keyboardDir();
    const spd = speedFromRadius(player.dispR);
    player.x += dir.x*spd*dt; player.y += dir.y*spd*dt;
    player.r = player.dispR; clampWorld(player);

    for (let i=pellets.length-1;i>=0;i--){
      const p=pellets[i]; const d=Math.hypot(p.x-player.x,p.y-player.y);
      if (d < player.dispR){ player.mass += 1.1; pellets[i]=makePellet(); }
    }
    if (player.mass > 60) player.mass *= (1 - 0.0015*dt);
  }

  function updateBot(bot, dt){
    bot.dispR += (radiusFromMass(bot.mass)-bot.dispR)*Math.min(1,dt*6);
    const distP = Math.hypot(player.x-bot.x, player.y-bot.y);
    let dir = null;
    if (distP < 420) {
      if (bot.mass > player.mass*1.15) dir = { x:(player.x-bot.x)/distP, y:(player.y-bot.y)/distP };
      else if (player.mass > bot.mass*1.15) dir = { x:(bot.x-player.x)/distP, y:(bot.y-player.y)/distP };
    }
    if (!dir) {
      let nearest=null, nd=Infinity;
      for (const p of pellets){ const d=Math.hypot(p.x-bot.x,p.y-bot.y); if(d<260 && d<nd){nd=d; nearest=p;} }
      if (nearest) dir = { x:(nearest.x-bot.x)/nd, y:(nearest.y-bot.y)/nd };
    }
    if (!dir) {
      bot.wanderT -= dt;
      if (bot.wanderT <= 0) { const a=Math.random()*Math.PI*2; bot.wanderDir={x:Math.cos(a),y:Math.sin(a)}; bot.wanderT=1.5+Math.random()*2; }
      dir = bot.wanderDir;
    }
    const spd = speedFromRadius(bot.dispR);
    bot.x += dir.x*spd*dt; bot.y += dir.y*spd*dt;
    bot.r = bot.dispR; clampWorld(bot);

    for (let i=pellets.length-1;i>=0;i--){
      const p=pellets[i]; const d=Math.hypot(p.x-bot.x,p.y-bot.y);
      if (d < bot.dispR){ bot.mass += 1.1; pellets[i]=makePellet(); }
    }
    if (bot.mass > 60) bot.mass *= (1 - 0.0015*dt);
  }

  function checkCollisions(){
    for (let i=0;i<bots.length;i++){
      const bot = bots[i];
      const d = Math.hypot(player.x-bot.x, player.y-bot.y);
      const overlap = d < Math.max(player.dispR, bot.dispR) - Math.min(player.dispR,bot.dispR)*0.35;
      if (!overlap) continue;
      if (player.mass > bot.mass*1.15) { player.mass += bot.mass*0.6; bots[i] = makeBot(i+1, player); }
      else if (bot.mass > player.mass*1.15) { endGame(); return; }
    }
  }

  function endGame(){
    running = false;
    saveBest(player.name, player.mass);
    document.getElementById('go-mass').textContent = Math.round(player.mass);
    document.getElementById('go-best').textContent = getBest(player.name);
    showScreen('screen-over');
  }

  function worldToScreen(x,y, camX, camY, scale){
    return { x: innerWidth/2 + (x-camX)*scale, y: innerHeight/2 + (y-camY)*scale };
  }

  function draw(){
    const targetScale = Math.max(0.55, Math.min(1.15, 1.2 - player.dispR/230));
    camScale += (targetScale-camScale)*0.05;
    const camX = player.x, camY = player.y;

    ctx.fillStyle = '#04070c';
    ctx.fillRect(0,0,innerWidth,innerHeight);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    const gStep = 100*camScale; const offX = (innerWidth/2 - camX*camScale) % gStep; const offY = (innerHeight/2 - camY*camScale) % gStep;
    for (let x=offX; x<innerWidth; x+=gStep){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,innerHeight); ctx.stroke(); }
    for (let y=offY; y<innerHeight; y+=gStep){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(innerWidth,y); ctx.stroke(); }

    // pellets
    pellets.forEach(p=>{
      const s = worldToScreen(p.x,p.y,camX,camY,camScale);
      if (s.x<-20||s.x>innerWidth+20||s.y<-20||s.y>innerHeight+20) return;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(s.x,s.y,p.r*camScale,0,Math.PI*2); ctx.fill();
    });

    function drawEntity(e, color, isPlayer){
      const s = worldToScreen(e.x,e.y,camX,camY,camScale);
      const rr = e.dispR*camScale;
      const grad = ctx.createRadialGradient(s.x-rr*0.3,s.y-rr*0.3,rr*0.1,s.x,s.y,rr);
      grad.addColorStop(0, isPlayer? '#8fd0ff':'#ffffff55');
      grad.addColorStop(1, color);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `${Math.max(11,12*camScale)}px sans-serif`; ctx.textAlign='center';
      ctx.fillText(e.name, s.x, s.y+4);
    }

    bots.forEach(b=>drawEntity(b, b.color, false));
    drawEntity(player, player.color, true);
  }

  function loop(t){
    if (!running) return;
    if (!lastT) lastT = t;
    const dt = Math.min(0.05, (t-lastT)/1000);
    lastT = t;
    updatePlayer(dt);
    bots.forEach(b=>updateBot(b, dt));
    checkCollisions();
    if (!running) return;
    document.getElementById('hud-mass').textContent = Math.round(player.mass);
    draw();
    requestAnimationFrame(loop);
  }

  showScreen('screen-setup');
})();
</script>
</body>
</html>
