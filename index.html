<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مار بازی</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0e1621;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    padding: 12px;
  }
  h1 {
    font-size: 22px;
    margin: 4px 0 10px 0;
    color: #4fa8ff;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 400px;
    font-size: 16px;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  #hud span b { color: #4fa8ff; }
  #board-wrap {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #17212b;
    border-radius: 14px;
    border: 2px solid #223244;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(14,22,33,0.88);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 22px; }
  #overlay p { margin: 0; color: #9db2c7; font-size: 14px; }
  button.btn {
    background: #4fa8ff;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn:active { opacity: 0.8; }
  #controls {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 55px 55px 55px;
    gap: 8px;
    margin-top: 16px;
  }
  .ctrl-btn {
    background: #1f2a38;
    border: 1px solid #2c3d52;
    border-radius: 12px;
    color: #4fa8ff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctrl-btn:active { background: #2c3d52; }
  .empty { visibility: hidden; }
</style>
</head>
<body>
<div id="app">
  <h1>🐍 مار بازی</h1>
  <div id="hud">
    <span>امتیاز: <b id="score">0</b></span>
    <span>رکورد: <b id="best">0</b></span>
  </div>
  <div id="board-wrap">
    <canvas id="board"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">آماده‌ای؟</h2>
      <p id="overlay-text">با فلش‌ها یا دکمه‌های پایین حرکت کن</p>
      <button class="btn" id="start-btn">شروع بازی</button>
    </div>
  </div>
  <div id="controls">
    <div class="ctrl-btn empty"></div>
    <div class="ctrl-btn" id="btn-up">▲</div>
    <div class="ctrl-btn empty"></div>
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-down">▼</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try {
      document.body.style.background = tg.themeParams.bg_color ? '#' + '' : '';
    } catch (e) {}
  }

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const GRID = 18;
  let cellSize;

  function resize() {
    const wrap = document.getElementById('board-wrap');
    const size = wrap.clientWidth;
    canvas.width = size * devicePixelRatio;
    canvas.height = size * devicePixelRatio;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    cellSize = size / GRID;
    draw();
  }
  window.addEventListener('resize', resize);

  let snake, dir, nextDir, food, score, best, alive, loopId;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function placeFood() {
    while (true) {
      const p = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      if (!snake.some(s => s.x === p.x && s.y === p.y)) return p;
    }
  }

  function reset() {
    snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    food = placeFood();
    score = 0;
    alive = true;
    scoreEl.textContent = score;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // food
    ctx.fillStyle = '#ff5c5c';
    roundRect(food.x * cellSize + 2, food.y * cellSize + 2, cellSize - 4, cellSize - 4, 5);
    ctx.fill();
    // snake
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#4fa8ff' : '#3d7fc9';
      roundRect(s.x * cellSize + 1, s.y * cellSize + 1, cellSize - 2, cellSize - 2, 4);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function tick() {
    if (!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      food = placeFood();
      if (tg) tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light');
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    alive = false;
    clearInterval(loopId);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'باختی! 💥';
    overlayText.textContent = 'امتیاز: ' + score;
    startBtn.textContent = 'دوباره بازی کن';
    overlay.classList.remove('hidden');
    if (tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error');
  }

  function startGame() {
    reset();
    overlay.classList.add('hidden');
    draw();
    clearInterval(loopId);
    loopId = setInterval(tick, 140);
  }

  startBtn.addEventListener('click', startGame);

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // no reverse
    nextDir = { x, y };
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') setDir(0, -1);
    else if (e.key === 'ArrowDown') setDir(0, 1);
    else if (e.key === 'ArrowLeft') setDir(-1, 0);
    else if (e.key === 'ArrowRight') setDir(1, 0);
  });

  document.getElementById('btn-up').addEventListener('click', () => setDir(0, -1));
  document.getElementById('btn-down').addEventListener('click', () => setDir(0, 1));
  document.getElementById('btn-left').addEventListener('click', () => setDir(-1, 0));
  document.getElementById('btn-right').addEventListener('click', () => setDir(1, 0));

  // swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  });

  reset();
  resize();
})();
</script>
</body>
</html>
